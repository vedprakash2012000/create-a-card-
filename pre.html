<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: "gilroy";
            box-sizing: border-box;
        }

        
        
        #main{
            padding: 30px;
            width: 100%;
            height: 100%;
            background-color: #222;
            
        }
        .card{
            max-width: 300px;
            color: white;
            margin-top: 40px;
            border-radius: 10px;

            display:inline-block ;
            padding: 20px;
            border: 2px solid #555;
        }
        .profile{
            width: 50px;
            height: 50px;
            overflow: hidden;
            border-radius: 50%;
            margin-bottom: 10px;
        }
        .card h5{
            margin-top: 5px ;
        }

        .profile img {
            width: 100%;
            height: 100%;
            object-fit: cover;


        }

        .card p {
            font-size: 12px;
            margin-top: 20px;
        }
        
        
        
       

    </style>
</head>
<body>
    <div id="main">
     <form action ="">
     <input type="text" placeholder="profile pic">    

      <input type="text" placeholder="name">
      <input type="text" placeholder="info">
      <input type="text" placeholder="occupation">
      
      <input type="submit">
      <form action="">
    </form>
    

 </div> 

      

       

    

   
     
     
        
    <script src="kick.js"></script>
</body>
</html>
